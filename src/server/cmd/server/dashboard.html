<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S3Lite — control plane</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; background:#0f172a; color:#e2e8f0; }
  h1 { font-size: 22px; }
  h2 { font-size: 16px; margin-top: 28px; color:#94a3b8; text-transform: uppercase; letter-spacing:.08em; }
  .hint { font-size:12px; text-transform:none; letter-spacing:0; color:#64748b; margin-left:8px; }
  table { border-collapse: collapse; width: 100%; margin-top: 8px; }
  th, td { text-align:left; padding:6px 10px; border-bottom:1px solid #1e293b; font-size: 13px;}
  th { color:#94a3b8; }
  .ok { color:#4ade80; font-weight:600; }
  .degraded { color:#facc15; font-weight:600; }
  .at-risk { color:#f87171; font-weight:600; }
  .offline { color:#f87171; }
  .card { background:#1e293b; border-radius:10px; padding:14px 18px; margin:10px 0; }
  .grid { display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
  .stat { background:#1e293b; border-radius:10px; padding:12px 18px; }
  .stat b { font-size: 26px; display:block; }
  .stat.ok b { color:#4ade80; }
  .stat.risk b { color:#f87171; }
  .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600; }
  .badge.ok { background:#052e16; color:#4ade80; }
  .badge.offline { background:#450a0a; color:#f87171; }
  .badge.warn { background:#422006; color:#facc15; }
  .cluster-badge { padding:6px 18px; border-radius:999px; font-size:15px; font-weight:700; letter-spacing:.05em; }
  .cluster-badge.healthy { background:#052e16; color:#4ade80; }
  .cluster-badge.degraded { background:#422006; color:#facc15; }
  .cluster-badge.critical { background:#450a0a; color:#f87171; }
  .sub { font-size:11px; color:#64748b; display:block; margin-top:1px; }
  .diskbar { background:#0f172a; border-radius:4px; height:10px; width:110px; margin-top:3px; overflow:hidden; }
  .diskbar > div { height:100%; border-radius:4px; }
  .diskbar .low  { background:#4ade80; }
  .diskbar .mid  { background:#facc15; }
  .diskbar .high { background:#f87171; }
  .diskcell { min-width:150px; }
  tr.detail-row td { background:#16223b; border-bottom:2px solid #1e293b; padding:12px 16px; }
  .detail-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap:8px 24px; font-size:12.5px; }
  .detail-grid div b { color:#94a3b8; font-weight:600; display:block; font-size:11px; text-transform:uppercase; letter-spacing:.05em; }
  .logtail { background:#0b1220; border:1px solid #1e293b; border-radius:6px; padding:8px 10px; margin-top:10px;
             font-family: ui-monospace, monospace; font-size:11.5px; color:#f87171; white-space:pre; overflow-x:auto; }
  .node-row { cursor:pointer; }
  .node-row:hover td { background:#1a2740; }
  .chev { color:#64748b; font-size:11px; }
  /* Nodes whose agent reports a version older than the newest one seen in
     the cluster: yellow row tint plus a marker bar on the left edge. */
  .node-row.outdated td { background:rgba(250,204,21,.07); }
  .node-row.outdated:hover td { background:rgba(250,204,21,.13); }
  .node-row.outdated td:first-child { box-shadow:inset 3px 0 0 #facc15; }
  button { background:#0ea5e9; color:#fff; border:0; border-radius:6px; padding:8px 14px; cursor:pointer; font-size:13px;}
  button.del { background:#7f1d1d; padding:4px 10px; }
  button.del:hover { background:#ef4444; }
  button.pref { background:#334155; padding:3px 9px; font-size:13px; }
  button.pref.on { background:#ca8a04; }
  button.pref:hover { background:#475569; }
  button.pref.on:hover { background:#eab308; }
  button.pref:disabled { background:#475569; cursor:wait; }
  button.upd { background:#b45309; padding:3px 9px; font-size:11px; margin-left:8px; vertical-align:middle; }
  button.upd:hover { background:#f59e0b; }
  button.upd:disabled { background:#475569; cursor:wait; }
  button.warn { background:#7f1d1d; }
  button.warn:hover { background:#ef4444; }
  button.warn:disabled { background:#475569; cursor:wait; }
  .result { margin-top:8px; font-size:13px; color:#94a3b8; min-height:16px; }
  .banner { background:#450a0a; color:#fecaca; border:1px solid #7f1d1d; border-radius:8px;
            padding:10px 14px; margin:10px 0; font-size:13.5px; line-height:1.5; }
  a { color:#0ea5e9; }
</style>
</head>
<body>
<h1>🛰 S3Lite — control plane</h1>
<div class="grid" id="stats"></div>
<div id="dup-banner" class="banner" hidden></div>

<h2>Registered nodes <span class="hint">status computed from heartbeat freshness (TTL) · click a row for node details</span></h2>
<div class="card">
 <table id="nodes">
   <thead><tr>
     <th></th><th>Node</th><th>IP:port</th><th>OS</th><th>Status</th><th>Disk</th><th>Last heartbeat</th><th>Volumes</th><th>EC shards</th><th title="Preferred replica target: the master places new raw replicas here first (before EC coding); falls back to regular nodes">★</th><th></th>
   </tr></thead>
   <tbody></tbody>
 </table>
 <div id="del-result" class="result"></div>
</div>

<h2>EC volumes</h2>
<div class="card">
 <table id="volumes">
   <thead><tr>
     <th>Collection</th><th>Volume</th><th>Config</th><th>State</th><th>Shards</th><th>Offline nodes</th><th>Power on to restore</th>
   </tr></thead>
   <tbody></tbody>
 </table>
</div>

<h2>Actions</h2>
<div class="card">
  <button onclick="testNotify()">Test notification</button>
  <span id="notify-result"></span>
  <button class="warn" onclick="cleanOrphans()" title="Deletes collections that hold volume data on the nodes but have no bucket on the filer (unreachable through S3, e.g. after a filer metadata reset)">🧹 Clean orphaned data</button>
  <span id="orphans-result"></span>
</div>

<script>
function esc(s){ return String(s==null?'':s).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"'); }
function fmtBytes(b){ if(!b) return '0 B'; const u=['B','KB','MB','GB','TB']; const i=Math.min(u.length-1,Math.floor(Math.log(b)/Math.log(1024)));
  return (b/Math.pow(1024,i)).toFixed(i?1:0)+' '+u[i]; }
function ago(t){ if(!t) return 'never'; const d=new Date(t);
  if(isNaN(d.getTime()) || d.getFullYear() < 2000) return 'never';
  const s=Math.floor((Date.now()-d.getTime())/1000);
  if(s<0) return 'now'; if(s<60) return s+'s ago'; if(s<3600) return Math.floor(s/60)+'m ago';
  return Math.floor(s/3600)+'h ago'; }
function fmtUptime(sec){ if(!sec) return '—'; const d=Math.floor(sec/86400), h=Math.floor(sec%86400/3600), m=Math.floor(sec%3600/60);
  if(d) return d+'d '+h+'h'; if(h) return h+'h '+m+'m'; return m+'m'; }
function diskBar(used, cap){
  if(!cap) return fmtBytes(used);
  const pct = Math.min(100, Math.round(used/cap*1000)/10);
  const cls = pct>=90 ? 'high' : (pct>=80 ? 'mid' : 'low');
  return fmtBytes(used)+' / '+fmtBytes(cap)+' ('+pct+'%)'+
    '<div class="diskbar"><div class="'+cls+'" style="width:'+Math.min(100,pct)+'%"></div></div>';
}
// Node ids expanded by the user; re-applied on every auto-refresh so the
// details row doesn't collapse when the table is re-rendered.
const expanded = new Set();
async function load(){
  const j = await (await fetch('/api/v1/dashboard')).json();
  const ec = j.ec, cap = j.capacity, ns = j.node_status, nodes = j.nodes, health = j.health||'healthy';
  const dups = j.duplicates || [];
  const latestAgent = j.agent_latest_version || '';
  const outdated = (j.agents_outdated||0);
  // Sort by node id so rows keep their position across auto-refreshes;
  // otherwise a node "jumps" whenever any other one updates its heartbeat.
  // Numeric-aware compare: node-2 sorts before node-10.
  nodes.sort((a,b)=>String(a.node_id).localeCompare(String(b.node_id), undefined, {numeric:true}));
  const dupBanner = document.getElementById('dup-banner');
  if (dups.length) {
    dupBanner.hidden = false;
    dupBanner.innerHTML = '⚠ <b>Duplicate node IDs detected:</b> '+dups.map(esc).join(', ')+
      ' — several machines share one node_id (e.g. cloned VM images carry the same '+
      '/var/lib/s3lite/agent/agent.json). They collide in the registry: shared rack/port, '+
      'mixed stats, misdirected update commands. '+
      'Fix: give each machine a unique node_id in /var/lib/s3lite/agent/agent.json '+
      'and restart s3lite-agent.';
  } else { dupBanner.hidden = true; }
  document.getElementById('stats').innerHTML =
    '<span class="cluster-badge '+esc(health)+'">'+esc(health.toUpperCase())+'</span>'+
    '<div class="stat"><b>'+nodes.length+'</b>nodes</div>'+
    '<div class="stat ok"><b>'+ns.online+'</b>online</div>'+
    '<div class="stat"><b>'+(ns.degraded||0)+'</b>degraded</div>'+
    '<div class="stat risk"><b>'+ns.offline+'</b>offline</div>'+
    '<div class="stat'+(outdated?' ok':'')+'" title="Newest agent version seen in the cluster: '+(latestAgent?esc(latestAgent):'—')+'"><b>'+outdated+'</b>agent'+(outdated===1?'':'s')+' outdated</div>'+
    '<div class="stat"><b>'+ec.ok+'</b>EC ok</div>'+
    '<div class="stat risk"><b>'+ec.at_risk+'</b>EC at risk</div>'+
    '<div class="stat"><b>'+fmtBytes(cap.used_bytes)+'</b>used / '+fmtBytes(cap.total_bytes)+'</div>'+
    '<div class="stat ok"><b>'+fmtBytes(cap.free_bytes)+'</b>free</div>';
  const nt=nodes.map(n=>{
    const cl = n.status === 'online' ? 'ok' : 'offline';
    const isOutdated = !!n.agent_outdated;
    const badge = '<span class="badge '+cl+'">'+n.status+'</span>'+
      (n.health==='degraded' ? ' <span class="badge warn">degraded</span>' : '')+
      (isOutdated ? ' <span class="badge warn" title="Agent version '+esc(n.agent_version)+' is older than the newest one seen in the cluster ('+esc(latestAgent)+')">⚠ agent '+esc(n.agent_version)+' (latest '+esc(latestAgent)+')</span>' : '')+
      (dups.includes(n.node_id) ? ' <span class="badge warn" title="This node_id is seen from more than one machine">duplicate id</span>' : '');
    const os = [n.os, n.os_version].filter(Boolean).join(' ');
    const sub = [n.rack, n.zone, n.stability].filter(Boolean).join(' · ');
    const detail =
      (n.friendly_name ? '<div><b>Friendly name</b>'+esc(n.friendly_name)+'</div>' : '')+
      '<div><b>Registered at</b>'+ago(n.registered_at)+'</div>'+
      (n.agent_version ? '<div><b>Agent version</b>'+esc(n.agent_version)+
        (n.agent_outdated ? ' <span class="badge warn">outdated — latest '+esc(latestAgent)+'</span>' : '')+
        '<button class="upd" data-upd="'+esc(n.node_id)+'" title="Reinstall the agent package on this node (configs preserved); the command is delivered with its next heartbeat">⟳ Update agent</button>'+
        (n.update_status ? '<span class="sub">update: '+esc(n.update_status)+
          (n.update_detail ? ' — '+esc(n.update_detail) : '')+
          (n.update_requested_at ? ' ('+ago(n.update_requested_at)+')' : '')+'</span>' : '')+
        '</div>' : '')+
      (n.weed_version ? '<div><b>Weed version</b>'+esc(n.weed_version)+'</div>' : '')+
      (n.agent_uptime_sec ? '<div><b>Agent uptime</b>'+fmtUptime(n.agent_uptime_sec)+'</div>' : '')+
      (n.volume_uptime_sec ? '<div><b>Volume uptime</b>'+fmtUptime(n.volume_uptime_sec)+'</div>' : '')+
      (n.restarts_total ? '<div><b>Volume restarts</b>'+n.restarts_total+'</div>' : '')+
      (n.stats_age_sec ? '<div><b>Stats freshness</b>'+ago(new Date(Date.now()-n.stats_age_sec*1000).toISOString())+'</div>' : '');
    const isOpen = expanded.has(n.node_id);
    return '<tr class="node-row'+(isOutdated?' outdated':'')+'" data-id="'+esc(n.node_id)+'">'+
      '<td class="chev">'+(isOpen?'▼':'▶')+'</td>'+
      '<td><b>'+esc(n.node_id)+'</b>'+(sub?'<span class="sub">'+esc(sub)+'</span>':'')+'</td>'+
      '<td>'+esc(n.ip)+':'+n.volume_port+'</td>'+
      '<td title="'+esc(n.arch)+'">'+esc(os||'—')+(n.arch?'<span class="sub">'+esc(n.arch)+'</span>':'')+'</td>'+
      '<td>'+badge+'</td>'+
      '<td class="diskcell">'+diskBar(n.disk_used, n.capacity_bytes)+'</td>'+
      '<td>'+ago(n.last_heartbeat)+'</td>'+
      '<td>'+n.volumes_count+'</td><td>'+n.ec_shards_count+'</td>'+
      '<td><button class="pref'+(n.preferred?' on':'')+'" data-pref="'+esc(n.node_id)+'" title="Preferred replica target: new raw replicas are placed on this node first (before EC coding)">★</button></td>'+
      '<td><button class="del" data-id="'+esc(n.node_id)+'" title="Delete node permanently">✕</button></td></tr>'+
      (detail ? '<tr class="detail-row"'+(isOpen?'':' hidden')+'><td colspan="11"><div class="detail-grid">'+detail+'</div>'+
        (n.log_tail ? '<div class="logtail">'+esc(n.log_tail)+'</div>' : '')+'</td></tr>' : '');
  }).join('');
  document.querySelector('#nodes tbody').innerHTML = nt || '<tr><td colspan=11>— no nodes registered —</td></tr>';
  const vt=j.volumes.map(v=>'<tr><td>'+esc(v.collection)+'</td><td>'+v.volume_id+'</td>'+
    '<td>'+(v.data_shards?+(v.data_shards)+'+'+(v.parity_shards||0):'—')+'</td>'+
    '<td class="'+v.state.toLowerCase()+'">'+v.state+'</td>'+
    '<td>'+v.available_shards+'/'+v.total_shards+'</td>'+
    '<td>'+esc((v.offline_nodes||[]).join(', '))+'</td>'+
    '<td>'+esc((v.nodes_to_start||[]).join(', '))+'</td></tr>').join('');
  document.querySelector('#volumes tbody').innerHTML = vt || '<tr><td colspan=7>— no EC volumes —</td></tr>';
}
// Click a node row to expand/collapse its details row (the delete button
// keeps its own handler, so clicks on it do not toggle the accordion).
document.querySelector('#nodes tbody').addEventListener('click', async (e)=>{
  if(e.target.closest('button.del')) return;
  if(e.target.closest('button.upd')) return;
  if(e.target.closest('button.pref')) return;
  const row = e.target.closest('tr.node-row');
  if(!row) return;
  const det = row.nextElementSibling;
  if(det && det.classList.contains('detail-row')){
    det.hidden = !det.hidden;
    row.querySelector('.chev').textContent = det.hidden ? '▶' : '▼';
    if(det.hidden) expanded.delete(row.dataset.id); else expanded.add(row.dataset.id);
  }
});
document.querySelector('#nodes tbody').addEventListener('click', async (e)=>{
  const btn = e.target.closest('button.del');
  if(!btn) return;
  const id = btn.dataset.id;
  if(!confirm('Delete node "'+id+'" from the control plane?\nIt will disappear from the dashboard entirely, also when offline.')) return;
  const r = await fetch('/api/v1/nodes/'+encodeURIComponent(id), {method:'DELETE'});
  document.getElementById('del-result').textContent = r.ok ? 'deleted "'+id+'" ✓' : 'delete failed';
  load();
});
async function testNotify(){
  const r = await fetch('/api/v1/admin/notify/test', {method:'POST'});
  document.getElementById('notify-result').textContent = r.ok ? 'sent ✓' : 'failed';
}
// "Clean orphaned data" button: shows the orphaned collections (volume data
// with no bucket on the filer — unreachable through S3), asks for a
// confirmation, then deletes them via the master admin API.
async function cleanOrphans(){
  const out = document.getElementById('orphans-result');
  out.textContent = 'checking…';
  let info;
  try { info = await (await fetch('/api/v1/orphans')).json(); }
  catch(e) { out.textContent = 'orphan check failed'; return; }
  if(info.error){ out.textContent = 'orphan check failed: '+esc(info.error); return; }
  const orphans = info.orphans || [];
  if(!orphans.length){ out.textContent = 'no orphaned data found ✓'; return; }
  const lines = orphans.map(o=>'  • '+o.name+': '+fmtBytes(o.size)+' ('+o.files+' files, '+o.volumes+' volumes'+
    (o.ec_shards ? ', '+o.ec_shards+' EC shards' : '')+')').join('\n');
  if(!confirm('These collections hold volume data on the nodes but have no bucket on the filer, so they cannot be reached through S3 (typically after a filer metadata reset).\n\n'+lines+
    '\n\nTotal: '+fmtBytes(info.total_bytes)+
    '\n\nDelete them permanently? This cannot be undone.')) { out.textContent = 'cancelled'; return; }
  out.textContent = 'deleting…';
  let r;
  try { r = await fetch('/api/v1/orphans/cleanup', {method:'POST'}); }
  catch(e) { out.textContent = 'cleanup request failed'; return; }
  if(!r.ok){ out.textContent = 'cleanup failed (HTTP '+r.status+')'; return; }
  const j = await r.json();
  out.textContent = 'deleted '+(j.deleted||[]).length+' collection(s), freed '+fmtBytes(j.freed_bytes||0)+
    ((j.errors||[]).length ? ' — errors: '+j.errors.join('; ') : '')+' ✓';
  load();
}
// "Update agent" button (in the Agent version cell): schedule an agent
// self-update. The command is delivered to the agent with its next
// heartbeat; the agent reinstalls the s3lite-agent package preserving the
// node configuration and restarts its service.
document.querySelector('#nodes tbody').addEventListener('click', async (e)=>{
  const btn = e.target.closest('button.upd');
  if(!btn) return;
  const id = btn.dataset.upd;
  if(!confirm('Reinstall the s3lite-agent package on "'+id+'"?\n\nThe node configuration is preserved; the agent service will be restarted. The command is delivered with the node\'s next heartbeat (works even for currently offline nodes).')) return;
  btn.disabled = true;
  btn.textContent = '…';
  const r = await fetch('/api/v1/nodes/'+encodeURIComponent(id)+'/agent/update', {method:'POST'});
  document.getElementById('del-result').textContent = r.ok
    ? 'agent update requested for "'+id+'" ✓ (starts on its next heartbeat)'
    : 'agent update request failed';
  load();
});
// "Preferred node" toggle (★ column): the node receives new raw replicas
// first during the pre-EC phase; the master falls back to regular nodes
// when preferred ones run out of free slots.
document.querySelector('#nodes tbody').addEventListener('click', async (e)=>{
  const btn = e.target.closest('button.pref');
  if(!btn) return;
  const id = btn.dataset.pref;
  const turnOn = !btn.classList.contains('on');
  btn.disabled = true;
  const r = await fetch('/api/v1/nodes/'+encodeURIComponent(id)+'/preferred', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({preferred: turnOn})
  });
  btn.disabled = false;
  document.getElementById('del-result').textContent = r.ok
    ? '"'+id+'" is '+(turnOn ? 'now a preferred replica target ★' : 'no longer a preferred replica target')
    : 'preferred toggle failed';
  load();
});
setInterval(load, 5000); load();
</script>
</body>
</html>
